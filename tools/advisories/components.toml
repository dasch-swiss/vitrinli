# Component map: every BCR module with a `source.json` key in MODULE.bazel.lock
# and every `http_archive`, `git_override` and custom repository rule in
# MODULE.bazel, exactly once per (source, name). `inventory.py` fails on an
# unclassified, stale or duplicate entry.
#
#   shipped      in the sipi binary or image; `cpe` is the NVD vendor:product
#                prefix, and an `http_archive` adds `version_re`, whose group 1
#                is read from its URL
#   not_shipped  build tooling, dev-only or test-only; `reason` says why
#   no_feed      shipped but no public advisory feed; `reason` says why
#
# Optional `eol = <bare date>`: end of regular upstream support, recorded on the
# component (LTS and paid extended support do not count).
#
# No versions here: the lockfile or the URL of the scanned tree is the only
# version record, so a base tree reports its own.
#
# "Not linked" below means absent from `bazel query 'deps(//src/cli/rust:sipi)'`;
# protobuf and abseil-cpp enter the link through `cc_proto_library`'s aspect,
# which that query does not follow.

