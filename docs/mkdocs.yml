site_name: Vitrinli Documentation
site_url: https://sipi.io

repo_url: https://github.com/dasch-swiss/vitrinli
repo_name: dasch-swiss/vitrinli
edit_uri: blob/main/docs/
copyright: "&copy; 2017 - 2026 <a href='https://dasch.swiss' target='_blank'>Data and Service Center for the Humanities (DaSCH)</a>"

nav:
  - Home: index.md
  - Overview: guide/index.md
  - Introduction: guide/introduction.md
  - Reference: guide/sipi.md
  - JSON Output: guide/json-output.md
  - Running: guide/running.md
  - Lua Integration: lua/index.md
  - Lua Image Functions: lua/lua-image.md
  - SQLite Integration: lua/sqlite.md
  - Building: development/building.md
  - Building with Bazel: development/bazel.md
  - Nix dev shell: development/nix.md
  - CI and Release: development/ci.md
  - RBE Write Pressure: development/rbe-write-pressure.md
  - Developing: development/developing.md
  - Error Model: development/error-model.md
  - Fuzz Testing: development/fuzzing.md
  - Benchmarking: development/benchmarking.md
  - Allocator Replay: development/allocator-replay.md
  - Profiling: development/profiling.md
  - Testing Strategy: development/testing-strategy.md
  - Downstream Dependencies: development/downstream-dependencies.md
  - Commit and PR Conventions: development/commit-conventions.md
  - Reviewer Guidelines: development/reviewer-guidelines.md
  - Admission Control: operation/admission-control.md
  - Memory Budget: operation/memory-budget.md
  - Health Endpoint: operation/health-endpoint.md
  - Release Notes: release-notes/index.md

theme:
  name: material
  logo: 'assets/images/dasch-icon-white.svg'
  favicon: 'assets/images/dasch-favicon.ico'
  palette:
    primary: 'deep blue'
    accent: 'deep blue'
  features:
    - search.suggest
    - search.highlight
    - navigation.sections
    - toc.integrate
    - content.code.copy

docs_dir: src

extra_css:
  - 'assets/style/theme.css'

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

plugins:
  - search
  - llmstxt:
      markdown_description: >
        Vitrinli is a multithreaded, high-performance IIIF-compatible media server
        written in C++. It provides image format conversions, metadata preservation,
        and a Lua scripting interface.
      full_output: llms-full.txt
      sections:
        "Overview":
          - guide/index.md: "Project overview and features"
        "User Guide":
          - guide/introduction.md: "IIIF concepts and Vitrinli use cases"
          - guide/running.md: "CLI usage, server mode, logging, error codes"
          - guide/sipi.md: "IIIF URL syntax, configuration reference"
          - guide/json-output.md: "Structured JSON CLI output schema (--json)"
        "Lua Scripting":
          - lua/index.md: "Lua integration and server API"
          - lua/lua-image.md: "Lua image manipulation functions"
          - lua/sqlite.md: "SQLite integration from Lua"
        "Development":
          - development/building.md: "Build instructions overview"
          - development/bazel.md: "Bazel build system: MODULE.bazel, BUILD.bazel, common commands, --config flags, query"
          - development/nix.md: "Nix dev shell: setup, what's on PATH, direnv"
          - development/ci.md: "CI and release pipeline guide"
          - development/developing.md: "Development guide"
          - development/error-model.md: "Error model: SipiValueError, the ErrorCode/policy table, and the three seam mappings"
          - development/downstream-dependencies.md: "Runtime packages and downstream consumers"
          - development/fuzzing.md: "Fuzz testing with libFuzzer"
          - development/benchmarking.md: "Microbenchmarks with Google Benchmark: just bench, bench-compare, the regression decision rule"
          - development/allocator-replay.md: "Allocator replay harness: RSS-floor measurement of the JP2 decode path, leak-vs-retention method, allocator baselines"
          - development/profiling.md: "Profiling with Tracy: just bazel-build-tracy, when to use Tracy vs Prometheus/Grafana vs bench, adding zones"
          - development/testing-strategy.md: "Testing strategy, coverage matrices, and feature inventory"
          - development/commit-conventions.md: "Commit organization and PR description conventions"
          - development/reviewer-guidelines.md: "Code review checklist for human and AI reviewers"
        "Release Notes":
          - release-notes/index.md
