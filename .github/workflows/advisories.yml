# Daily advisory scan of the default branch and the rolling issue that carries
# its findings ("Dependency advisory scanning" in docs/src/development/ci.md).
# No Bazel and no Nix: the tools are stdlib Python on the runner's `python3`,
# the scanners come from `advisories-scanners`.

name: advisories

on:
  # 05:41 UTC, off the top of the hour and clear of fuzz.yml's 03:17.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the issue body to the job summary and leave the issue alone
        type: boolean
        default: false

permissions: {}

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: ./.github/actions/advisories-scanners
      # Findings (exit 1 with the findings file written) leave the job green:
      # the issue is their signal. Drift (exit 1, no findings file) and a
      # scanner error (exit 3) fail it, and the issue job does not run.
      - name: Scan
        run: |
          code=0
          just advisories-scan || code=$?
          if [ "$code" -ne 0 ] && ! { [ "$code" -eq 1 ] && [ -f advisories-findings.json ]; }; then
            exit "$code"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: advisories-scan
          path: |
            advisories.cdx.json
            advisories-findings.json
          if-no-files-found: error

  issue:
    needs: [scan]
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      TITLE: Open dependency advisories
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Full history: the pin table dates each pin with `git log -S`.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: advisories-scan
      - name: Render the issue body
        id: report
        run: >-
          python3 tools/advisories/report.py
          --config tools/advisories/advisories.toml
          --inventory advisories.cdx.json
          --findings advisories-findings.json
          --output advisories-issue.md
          --summary "$GITHUB_STEP_SUMMARY"
          --run-url "$RUN_URL"
          >> "$GITHUB_OUTPUT"
      # Only a run of the default branch speaks for it (a schedule always is
      # one); a dispatch from another branch acts as a dry run.
      - name: Create, update or close the issue
        if: ${{ github.event_name == 'schedule' || (!inputs.dry_run && github.ref_name == github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.report.outputs.label }}
          OPEN: ${{ steps.report.outputs.open }}
        run: |
          set -euo pipefail
          number="$(gh issue list --label "$LABEL" --state open --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file advisories-issue.md
            if [ "$OPEN" -eq 0 ]; then
              gh issue close "$number" --comment "No unignored finding in $RUN_URL."
            fi
          elif [ "$OPEN" -gt 0 ]; then
            gh label create "$LABEL" --force --description "Dependency advisories from advisories.yml"
            gh issue create --title "$TITLE" --label "$LABEL" --body-file advisories-issue.md
          fi
