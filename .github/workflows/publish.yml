name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker:
    runs-on: ${{ matrix.runner }}
    name: validate-docker / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            bazel-platform: "//platforms:linux_x86_64"
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel-platform: "//platforms:linux_aarch64"
    env:
      # Every bazel build/run/test in this job re-evaluates the
      # gh_release_archive repository_rule, which fetches from a private
      # GitHub release and requires GH_TOKEN. Hoisted to the job level so
      # any future Bazel step inherits it (cf. publish.yml history where
      # adding it per-step caused repeated near-miss failures).
      GH_TOKEN: ${{ secrets.DASCHBOT_PAT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - name: Set up CI environment
        id: setup
        uses: ./.github/actions/ci-setup
        with:
          lfs: "true"
          target-platform: ${{ matrix.bazel-platform }}
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build Docker image (Bazel rules_oci)
        run: just bazel-docker-build-${{ matrix.arch }} ${{ steps.setup.outputs.flags }} --build_event_json_file=bep-validate-${{ matrix.arch }}.json
      # Attach the Build Event Protocol JSON so the action/remote cache hit
      # rate can be analyzed offline (cf. ci.yml). Bazel emits one
      # BuildMetrics event per invocation whose actionSummary.runnerCount[]
      # breaks actions down by runner type (total / remote cache hit /
      # remote / local / internal) — the cache-hit signal, present in the
      # default BEP. `always()` so a failed build's breakdown (often the
      # most interesting) is still captured.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bep-validate-${{ matrix.arch }}
          path: bep-validate-${{ matrix.arch }}.json
          retention-days: 30
      # Exercise the release-only debug-symbol extraction in the validation
      # stage so it can't silently break at publish time (as it did for
      # v6.0.0). The artifact is discarded here — publish-docker rebuilds it
      # for the actual Sentry upload.
      - name: Extract debug symbols (validation)
        run: just bazel-docker-extract-debug ${{ matrix.arch }} ${{ steps.setup.outputs.flags }}
      # `:docker_smoke` rust_test loads the OCI tarball produced by
      # `//src:image_load` and runs the smoke suite against it. The Docker
      # image already loaded by the build step above is left alone.
      - name: Run Docker smoke tests
        run: just bazel-test-smoke ${{ steps.setup.outputs.flags }}

      # Persist the repository cache even when the job fails — the paired
      # save for ci-setup's restore-only cache step (rationale there).
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.setup.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.setup.outputs.repo-cache-key }}

  # Fails on an advisory this tag adds over the last release that reached
  # Docker Hub. A re-run clears only a transient exit 3; a finding ships only
  # through a new release (docs/src/development/ci.md "Tag release CI/CD").
  advisories-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: ./.github/actions/advisories-scanners
      - name: Resolve the release baseline
        id: baseline
        env:
          TAG: ${{ github.ref_name }}
        run: |
          baseline="$(just advisories-release-baseline "$TAG")"
          echo "tag=$baseline" >> "$GITHUB_OUTPUT"
      - run: just advisories-scan-diff "$BASELINE"
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
      - name: Upload the release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.ref_name }}
          path: advisories-sbom.cdx.json
          if-no-files-found: error

  release-gate:
    runs-on: ubuntu-latest
    needs: [validate-docker, advisories-gate]
    steps:
      - name: Validation gate
        run: echo "Docker validation and the advisories gate passed; publish side effects may proceed."

  publish-docker:
    runs-on: ${{ matrix.runner }}
    needs: [release-gate]
    name: publish-docker / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            bazel-platform: "//platforms:linux_x86_64"
            debug_file: sipi-amd64.debug
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel-platform: "//platforms:linux_aarch64"
            debug_file: sipi-arm64.debug
    env:
      # Every bazel build/run/test in this job re-evaluates the
      # gh_release_archive repository_rule, which fetches from a private
      # GitHub release and requires GH_TOKEN. Hoisted to the job level so
      # any future Bazel step inherits it.
      GH_TOKEN: ${{ secrets.DASCHBOT_PAT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      # This job doesn't run the smoke test and build + extract-debug + push
      # read no LFS test images, so no LFS pull is needed here.
      - name: Set up CI environment
        id: setup
        uses: ./.github/actions/ci-setup
        with:
          lfs: "false"
          target-platform: ${{ matrix.bazel-platform }}
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build Docker image (Bazel rules_oci) + sipi-debug
        # Binary version + OCI image tag come from version.txt, which
        # release-please updates before cutting the tag — no extra
        # plumbing required to keep them in sync with `${github.ref_name}`.
        run: just bazel-docker-build-${{ matrix.arch }} ${{ steps.setup.outputs.flags }} --build_event_json_file=bep-publish-${{ matrix.arch }}.json
      # Attach the Build Event Protocol JSON so the action/remote cache hit
      # rate can be analyzed offline (cf. ci.yml). See the validate-docker
      # job for the actionSummary.runnerCount[] breakdown this captures.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bep-publish-${{ matrix.arch }}
          path: bep-publish-${{ matrix.arch }}.json
          retention-days: 30
      - name: Extract debug symbols for Sentry upload
        # The genrule depends on `:sipi`, already built and in the
        # remote cache from the build step just above.
        run: just bazel-docker-extract-debug ${{ matrix.arch }} ${{ steps.setup.outputs.flags }}
      # The identical commit was already smoke-tested in validate-docker
      # minutes earlier — no need to repeat it here.
      # `oci_push` runs `jq` as an exec-platform tool. The arm64 image is
      # cross-built on the x86_64 RBE worker (exec = x86_64), so the push
      # script bundles the x86_64 `jq`, which can't execute on this arm64
      # runner. Register binfmt_misc so the kernel runs that x86_64 tool
      # under qemu emulation — the push is network-bound (crane uploads
      # layers) with only trivial jq work, so the emulation cost is
      # negligible and we keep the fast worker cross-build. amd64 runs the
      # push natively and needs none of this.
      - name: Enable x86_64 emulation for the cross-built push tooling
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Push image to Docker Hub
        run: just bazel-docker-push-${{ matrix.arch }} ${{ steps.setup.outputs.flags }}

      - name: Install sentry-cli
        run: npm install -g @sentry/cli

      - name: Upload Docker debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -f "${{ matrix.debug_file }}" ]; then
            sentry-cli debug-files upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              "${{ matrix.debug_file }}"
          else
            echo "Expected debug symbol file not found: ${{ matrix.debug_file }}"
            exit 1
          fi

      # Persist the repository cache even when the job fails — the paired
      # save for ci-setup's restore-only cache step (rationale there).
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.setup.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.setup.outputs.repo-cache-key }}

  manifest:
    runs-on: ubuntu-latest
    needs: [publish-docker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      # `bazel-docker-publish-manifest` shells out to `crane index append`;
      # no bazel invocation, so no RBE/Bazel setup is needed here.
      - run: just bazel-docker-publish-manifest

  sentry:
    runs-on: ubuntu-latest
    needs: [publish-docker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: |
          echo "RELEASE_VERSION=$(git describe --tag --dirty --abbrev=7)" >> $GITHUB_ENV
      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ env.RELEASE_VERSION }}

  docs:
    runs-on: ubuntu-latest
    needs: [release-gate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Remove LFS hooks (not needed for docs deploy)
        run: rm -f .git/hooks/pre-push
      - uses: mhausenblas/mkdocs-deploy-gh-pages@a31c6b13a80e4a4fbb525eeb7a2a78253bb15fa5  # master @ 2024-07-19
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CUSTOM_DOMAIN: sipi.io
          CONFIG_FILE: docs/mkdocs.yml
          REQUIREMENTS: docs/requirements.txt
