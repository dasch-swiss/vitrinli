name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker:
    runs-on: ${{ matrix.runner }}
    name: validate-docker / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            bazel-platform: "//platforms:linux_x86_64"
          - arch: arm64
            runner: ubuntu-24.04-arm
            bazel-platform: "//platforms:linux_aarch64"
    env:
      # Every bazel build/run/test in this job re-evaluates the
      # gh_release_archive repository_rule, which fetches from a private
      # GitHub release and requires GH_TOKEN. Hoisted to the job level so
      # any future Bazel step inherits it (cf. publish.yml history where
      # adding it per-step caused repeated near-miss failures).
      GH_TOKEN: ${{ secrets.DASCHBOT_PAT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - name: Set up CI environment
        id: setup
        uses: ./.github/actions/ci-setup
        with:
          lfs: "true"
          target-platform: ${{ matrix.bazel-platform }}
          rbe-runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          rbe-ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          rbe-client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          rbe-client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build Docker image (Bazel rules_oci)
        run: just bazel-docker-build-${{ matrix.arch }} ${{ steps.setup.outputs.flags }} --build_event_json_file=bep-validate-${{ matrix.arch }}.json
      # Attach the Build Event Protocol JSON so the action/remote cache hit
      # rate can be analyzed offline (cf. ci.yml). Bazel emits one
      # BuildMetrics event per invocation whose actionSummary.runnerCount[]
      # breaks actions down by runner type (total / remote cache hit /
      # remote / local / internal) — the cache-hit signal, present in the
      # default BEP. `always()` so a failed build's breakdown (often the
      # most interesting) is still captured.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bep-validate-${{ matrix.arch }}
          path: bep-validate-${{ matrix.arch }}.json
          retention-days: 30
      - name: Extract debug symbols
        run: just bazel-docker-extract-debug ${{ matrix.arch }} ${{ steps.setup.outputs.flags }}
      # `:docker_smoke` rust_test loads the OCI tarball produced by
      # `//src:image_load` and runs the smoke suite against it. The release
      # flags make it the tarball `bazel-docker-image-tarball` copies out.
      - name: Run Docker smoke tests (release build)
        run: just bazel-test-smoke-release ${{ matrix.arch }} ${{ steps.setup.outputs.flags }}
      - name: Copy out the tested image tarball
        run: just bazel-docker-image-tarball ${{ matrix.arch }} ${{ steps.setup.outputs.flags }}
      # publish-docker pushes these two files as they are, so the registry
      # gets the image the smoke test ran on and Sentry gets its symbols. Kept
      # 7 days so a re-run of a failed publish-docker still finds them.
      - name: Upload tested image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sipi-image-${{ matrix.arch }}
          path: sipi-image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sipi-debug-${{ matrix.arch }}
          path: sipi-${{ matrix.arch }}.debug
          if-no-files-found: error
          retention-days: 7

      # Persist the repository cache even when the job fails — the paired
      # save for ci-setup's restore-only cache step (rationale there).
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.setup.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.setup.outputs.repo-cache-key }}

  release-gate:
    runs-on: ubuntu-latest
    needs: [validate-docker]
    steps:
      - name: Validation gate
        run: echo "Docker validation passed; publish side effects may proceed."

  publish-docker:
    runs-on: ubuntu-latest
    needs: [release-gate]
    name: publish-docker / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            debug_file: sipi-amd64.debug
          - arch: arm64
            debug_file: sipi-arm64.debug
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      # The image and debug file validate-docker tested; no build here.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sipi-image-${{ matrix.arch }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sipi-debug-${{ matrix.arch }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.22.1
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      # Tags from version.txt, which release-please updates before cutting
      # the tag. Fails when the pushed digest is not the tarball's.
      - name: Push the tested image to Docker Hub
        run: just docker-push-tarball ${{ matrix.arch }}

      - name: Install sentry-cli
        run: npm install -g @sentry/cli

      - name: Upload Docker debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -f "${{ matrix.debug_file }}" ]; then
            sentry-cli debug-files upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              "${{ matrix.debug_file }}"
          else
            echo "Expected debug symbol file not found: ${{ matrix.debug_file }}"
            exit 1
          fi

  manifest:
    runs-on: ubuntu-latest
    needs: [publish-docker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.22.1
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      # `bazel-docker-publish-manifest` shells out to `crane index append`;
      # no bazel invocation, so no RBE/Bazel setup is needed here.
      - run: just bazel-docker-publish-manifest

  sentry:
    runs-on: ubuntu-latest
    needs: [publish-docker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: |
          echo "RELEASE_VERSION=$(git describe --tag --dirty --abbrev=7)" >> $GITHUB_ENV
      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ env.RELEASE_VERSION }}

  docs:
    runs-on: ubuntu-latest
    needs: [release-gate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Remove LFS hooks (not needed for docs deploy)
        run: rm -f .git/hooks/pre-push
      - uses: mhausenblas/mkdocs-deploy-gh-pages@a31c6b13a80e4a4fbb525eeb7a2a78253bb15fa5  # master @ 2024-07-19
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CUSTOM_DOMAIN: sipi.io
          CONFIG_FILE: docs/mkdocs.yml
          REQUIREMENTS: docs/requirements.txt
